# Vérification (chaque pull request et chaque fusion dans main) puis déploiement automatique sur le serveur OVH
# (fusion dans main uniquement, si la vérification est verte). Décision : docs/decisions/deploiement-continu.md.
# Secrets (GitHub → Settings → Secrets and variables → Actions), créés par scripts/ovh/activer-deploiement-continu.sh :
#   DEPLOIEMENT_CLE         clé SSH privée, limitée sur le serveur au lancement de la mise à jour ;
#   DEPLOIEMENT_HOTE_CONNU  ligne « known_hosts » du serveur (son adresse et son empreinte).
name: Vérification et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    name: Vérifier (types, lint, format, tests, construction)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Mêmes étapes que /verifier (types, lint, format, tests, construction) : une seule liste, scripts/verifier.mjs.
      - run: npm run verifier
      # Vulnérabilités connues des dépendances embarquées en production (issue #124).
      - run: npm audit --omit=dev

  # Construction de l'image Docker, comme sur le serveur, sur chaque pull request (issue #124) : une image qui ne se
  # construit plus est vue avant la fusion, pas pendant la mise en production.
  image-docker:
    name: Construire l'image Docker
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag vinted-helper-verification .

  deployer:
    name: Déployer sur le serveur
    needs: verifier
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Un seul déploiement à la fois ; une fusion arrivée pendant un déploiement attend son tour.
    concurrency:
      group: deploiement
      cancel-in-progress: false
    steps:
      - name: Mise à jour du serveur
        env:
          CLE: ${{ secrets.DEPLOIEMENT_CLE }}
          HOTE_CONNU: ${{ secrets.DEPLOIEMENT_HOTE_CONNU }}
        run: |
          if [ -z "$CLE" ] || [ -z "$HOTE_CONNU" ]; then
            echo "::warning::Déploiement non activé (secrets DEPLOIEMENT_CLE et DEPLOIEMENT_HOTE_CONNU absents) : voir docs/guides/mise-en-ligne-ovh.md."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/deploiement
          chmod 600 ~/.ssh/deploiement
          printf '%s\n' "$HOTE_CONNU" > ~/.ssh/known_hosts
          hote="$(printf '%s' "$HOTE_CONNU" | head -n 1 | cut -d' ' -f1)"
          # La clé ne peut que lancer la mise à jour (commande imposée par le serveur) : aucune commande n'est envoyée.
          ssh -i ~/.ssh/deploiement -o BatchMode=yes -o IdentitiesOnly=yes "deploiement@$hote"

  # Tag de version (issue #114) : après une mise en production réussie, crée « vX.Y.Z » d'après le package.json racine
  # s'il n'existe pas encore. Pas de tag si le déploiement a échoué ou a été annulé (retour automatique, #119).
  etiqueter:
    name: Créer le tag de version
    needs: deployer
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # seulement ce job : pousser le tag
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag vX.Y.Z
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "Le tag $tag existe déjà : rien à faire."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Version $version" "$GITHUB_SHA"
          git push origin "$tag"
          echo "Tag $tag créé sur ${GITHUB_SHA:0:7}."
