# Mises à jour proposées par Dependabot (issue #124) : une PR par semaine et par écosystème au plus, les mises à jour
# mineures et correctives regroupées. Chaque PR passe par la CI ; rien n'est fusionné automatiquement.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      mineures:
        update-types: [minor, patch]
    # TypeScript 7 : typescript-eslint 8.x exige encore typescript < 6.1 (issue #169). À retirer quand une version de
    # typescript-eslint accepte TypeScript 7.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /outils/extension-vinted
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      mineures:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
