# Mises à jour proposées par Dependabot (issue #124) : une PR par semaine et par écosystème au plus, les mises à jour
# mineures et correctives regroupées. Chaque PR passe par la CI ; rien n'est fusionné automatiquement.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      mineures:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /outils/extension-vinted
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      mineures:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
