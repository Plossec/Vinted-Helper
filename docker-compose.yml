# Vinted Helper : application + base PostgreSQL.
# Démarrer : docker compose up -d --build      Arrêter (sans rien effacer) : docker compose stop
# ⚠️ Ne jamais lancer « docker compose down -v » : cela efface la base de données.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # La base est conservée dans un volume Docker (survit aux redémarrages et mises à jour).
      - base-donnees:/var/lib/postgresql/data
    ports:
      # Accessible uniquement depuis ce PC (scripts npm run db:…), jamais depuis le réseau.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOTE: db
      POSTGRES_PORT: "5432"
      PORT: "3000"
    ports:
      # En HTTP, accessible uniquement depuis ce PC (http://localhost:3000).
      # Le téléphone passe par le service « https » ci-dessous.
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      # Photos des articles : dossier « data/photos » du projet, visible depuis Windows.
      - ./data/photos:/app/data/photos

  # Accès HTTPS depuis le téléphone sur le Wi-Fi de la maison (issue #3, docs/guides/telephone-https.md).
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      IP_PC: ${IP_PC:-127.0.0.1}
    ports:
      # Ouverts au réseau local (Wi-Fi de la maison) : HTTPS de l'application + téléchargement du certificat.
      - "8443:8443"
      - "8080:8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Autorité de certification locale : conservée pour que le téléphone reste reconnu.
      - certificats:/data

  # Sauvegarde automatique quotidienne de la base et des photos (§5.13), conservée 30 jours dans sauvegardes/auto.
  sauvegarde:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/scripts/automatique.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: Europe/Paris
      SAUVEGARDE_HEURE: ${SAUVEGARDE_HEURE:-3}
    volumes:
      - ./scripts/sauvegarde:/scripts:ro
      - ./sauvegardes:/sauvegardes
      - ./data/photos:/photos

volumes:
  base-donnees:
  certificats:
